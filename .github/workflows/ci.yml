# site-api's checks, on every pull request. Every site and Carrel install this package
# by git tag, so a release is only as good as these. No secrets: the tests run in Node against the
# in-memory test site, and the conformance suite is part of `npm test`.
name: CI

on:
  # No push to main: the merge was checked as its pull request, and nothing deploys from main (a release is the tag
  # release.yml makes from the merge of a version bump). devkit README, "No second run on main".
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit sha, as the portfolio policy asks. The comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version in package.json's engines field.
          node-version-file: package.json
          cache: npm
      # `npm ci` runs the package's prepare script, which builds dist/.
      - run: npm ci
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - run: npm run build
      - run: npm test
      # The published package ships its runtime dependencies only; a high there fails the build.
      - run: npm audit --omit=dev --audit-level=high
