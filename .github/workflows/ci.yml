# site-api's checks, on every pull request. Every site and Carrel install this package
# by git tag, so a release is only as good as these. No secrets: the tests run in Node against the
# in-memory test site, and the conformance suite is part of `npm test`.
name: CI

on:
  # No push to main: the merge was checked as its pull request, and nothing deploys from main (a release is the tag
  # release.yml makes from the merge of a version bump). devkit README, "No second run on main".
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit sha, as the portfolio policy asks. The comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base-branch parent, which the changeset step diffs.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The version in package.json's engines field.
          node-version-file: package.json
          cache: npm
      # `npm ci` runs the package's prepare script, which builds dist/.
      - run: npm ci
      # Merging and releasing are two steps (.changeset/README.md): a pull request adds a changeset and leaves the version
      # alone; the release pull request sets the version and uses up every changeset. Renovate's bumps release nothing.
      - name: A changeset, or the release itself
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/')
        run: |
          was=$(git show HEAD^1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          now=$(node -p 'require("./package.json").version')
          if [ "$was" = "$now" ]; then
            npx changeset status --since=HEAD^1
          else
            left=$(find .changeset -name '*.md' ! -name README.md)
            [ -z "$left" ] || { echo "::error::The version moved from $was to $now, but changesets are left: $left. A release is \`npx changeset version\` on main, alone."; exit 1; }
          fi
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - run: npm run build
      - run: npm test
      # The published package ships its runtime dependencies only; a high there fails the build.
      - run: npm audit --omit=dev --audit-level=high
